name: Deploy Static Site with Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build Tailwind CSS
        working-directory: .
        run: |
          npm ci
          npm run build

      - name: Stamp deploy metadata into the page
        working-directory: .
        run: |
          SHORT="${GITHUB_SHA::7}"
          NOW_HUMAN="$(date -u +'%Y-%m-%d %H:%M UTC')"
          NOW_ISO="$(date -u +'%Y-%m-%dT%H:%MZ')"
          sed -i \
            -e "s/__COMMIT_SHA__/${GITHUB_SHA}/g" \
            -e "s/__COMMIT_SHORT__/${SHORT}/g" \
            -e "s/__DEPLOYED_AT__/${NOW_HUMAN}/g" \
            -e "s/__DEPLOYED_ISO__/${NOW_ISO}/g" \
            website/index.html
          if grep -qE '__(COMMIT|DEPLOYED)_' website/index.html; then
            echo "::error file=website/index.html::Unstamped deploy placeholders left in the page"
            exit 1
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Sync Website to S3 & Invalidate CloudFront
        run: |
          BUCKET_NAME=$(terraform output -raw bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_id)

          aws s3 sync ../website s3://$BUCKET_NAME --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"