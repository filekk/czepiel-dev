name: Deploy Static Site with Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c 'import sys, json, base64; p = sys.argv[1].split(".")[1]; d = json.loads(base64.urlsafe_b64decode(p + "==")); print(json.dumps({k: d.get(k) for k in ["iss", "aud", "sub", "repository", "repository_owner"]}, indent=2))' "$TOKEN"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Sync Website to S3 & Invalidate CloudFront
        run: |
          BUCKET_NAME=$(terraform output -raw bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_id)
          CF_DOMAIN=$(terraform output -raw cloudfront_domain)

          aws s3 sync ../website s3://$BUCKET_NAME --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

          echo "CloudFront domain: $CF_DOMAIN"